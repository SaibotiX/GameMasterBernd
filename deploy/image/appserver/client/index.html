<!doctype html>
<!-- The friend's page (08): three panes around the terminal, one thin
     status strip, nothing else. Every URL is RELATIVE on purpose: the page
     lives behind Caddy's /f/<token>/ prefix strip, so ./assets/… and
     ./ws/… resolve under the door while the server sees clean paths. -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- The door's path is the secret: never let a link carry it out. -->
	<meta name="referrer" content="no-referrer" />
	<title>World Console</title>
	<link rel="stylesheet" href="./assets/vendor/xterm.css" />
	<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
	<header id="strip">
		<span id="strip-name">World Console</span>
		<span id="strip-world" hidden></span>
		<span class="strip-spacer"></span>
		<button id="panes-toggle" type="button">pages</button>
		<span id="conn-dot" title="connection">●</span>
	</header>
	<main id="page">
		<section id="terminal-pane">
			<div id="terminal"></div>
			<div id="overlay" hidden><span id="overlay-text"></span></div>
		</section>
		<aside id="side">
			<section id="viewer">
				<nav id="tabs"></nav>
				<div id="viewer-body">
					<div id="viewer-empty">the chronicle opens here — pick a page below</div>
				</div>
			</section>
			<section id="files">
				<div id="files-head">
					<span id="files-label">pages</span>
					<label id="media-auto-wrap" title="the scrying glass opens its catch here by itself">
						<input type="checkbox" id="media-auto" checked /> glass shows
					</label>
				</div>
				<div id="tree"></div>
			</section>
		</aside>
	</main>
	<script src="./assets/vendor/xterm.js"></script>
	<script src="./assets/vendor/addon-fit.js"></script>
	<script src="./assets/vendor/addon-webgl.js"></script>
	<script src="./assets/vendor/marked.js"></script>
	<script src="./assets/vendor/purify.js"></script>
	<script src="./assets/app.js"></script>
</body>
</html>
