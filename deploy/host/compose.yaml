# Stage-1 host stack in HUB MODE (H1a step 2 — the WorldConsole repo's
# plan §H1a item 2, wiring contract §A.1): since the ingress cutover the
# box's front door is the HUB's caddy — this compose brings no box caddy
# of its own. What remains is the app side: one hardened container per
# friend (minted by new-friend.sh into the box-local, gitignored
# compose.override.yaml; each friend `extends` wc-template below — the
# tracked tree never carries a friend) and the waker, both joining the
# hub's attachable `ingress` network, where the hub caddy dials the doors
# by service name. Local end-to-end check: the `local` profile
# (localcheck.sh drives it) — same friend shape behind caddy-local's own
# self-signed front door; the dev rig stays fully self-contained (§A.1).
#
# The project name is the game's own since H1a step 2 (R36: `world-console`
# belongs to the hub; the box re-clones this repo at
# /home/deploy/gamemaster-bernd at the cutover sitting). Volumes and
# containers carry this prefix — the sitting copies friend data from the
# world-console_* volumes into the new names before its first `up`.
name: gamemaster-bernd

# The security boundary is the container (02): pi has no permission system,
# so the box a friend's model can reach IS the box we give it. Read-only
# root; ~/.pi/agent on tmpfs so auth.json lives and dies with the container
# (R11) while sessions/ and data/ persist as named volumes; no capabilities;
# bounded memory, cpu and pids. Outbound internet stays open (model APIs,
# MediaWiki hosts) — the LOCAL network is what must be unreachable, and
# that is the box firewall's DOCKER-USER job: the HUB's singleton since
# H1a (WC deploy/host/firewall.sh, its egress drops covering the pinned
# ingress subnet by construction; contract §A.5 — tenants ship no
# firewall unit; this repo's firewall.sh stays for solo deployments only).
x-friend: &friend
  image: world-console:latest
  init: true
  read_only: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,uid=1001,gid=1001
    - /home/player/.pi/agent:rw,uid=1001,gid=1001
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 256
  expose: ["7681"]
  networks: [web]
  # A stop is a seal (02 item 12): the app server hangs up pi, then ships
  # what remains — give it room. The host sweep re-treats anything cut short.
  stop_grace_period: 30s

services:
  # Start-on-connect (02 item 12): each door's second upstream. Holds the
  # docker socket. Since hub mode it sits on `ingress` — the hub's caddy,
  # the doors' proxy, must dial it — and on `wake`, where the dev rig's
  # caddy-local twin does. Deliberate, NAMED residue (H1a step 2): friends
  # share `ingress` too now, so a friend's model CAN knock here — but all
  # a knock can ever do is START a wc-* container by validated name
  # (waker.js); stop, inspect, anything else never leaves this process.
  waker:
    image: node:24-trixie-slim
    restart: unless-stopped
    volumes:
      - ./waker/waker.js:/waker.js:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "/waker.js"]
    networks: [wake, ingress]

  # The house lane's gateway (02 §house lane, R12/R29; shape from the item-1
  # spike): ONE process holding the org key, friends speak to it with
  # per-friend virtual keys minted by new-friend.sh. It lives on `web` so
  # friends can reach it by name — the org key itself never enters any
  # friend container, and the box publishes no port for it. State (keys.json
  # + usage.jsonl) is box-local and gitignored, same custody as
  # caddy/friends/. ANTHROPIC_ORG_KEY comes from ./.env on the box — never
  # this file, never an image layer. GATEWAY_UPSTREAM exists for localcheck
  # to point the lane at the stub; on the box it stays unset (real API).
  gateway:
    image: node:24-trixie-slim
    init: true
    restart: unless-stopped
    read_only: true
    # The player uid, same as in the friends' image: the state bind is
    # chowned to it (new-friend.sh's errand / localcheck's 777 throwaway),
    # so with every capability dropped the ledger append still lands.
    user: "1001:1001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    expose: ["4100"]
    volumes:
      - ./gateway/gateway.js:/gateway.js:ro
      - ${GATEWAY_STATE:-./gateway-state}:/data
    environment:
      ANTHROPIC_ORG_KEY: ${ANTHROPIC_ORG_KEY:-}
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-https://api.anthropic.com}
      # The ledger's ruled bounds ride the box .env only when overriding the
      # in-code defaults ($55/mo kill ≈ €50, $5.50/day alarm ≈ €5 — the
      # 2026-08-09 ruling); localcheck shrinks them to prove the tripwires.
      # NTFY_TOPIC is the maintainer's push channel — the topic name is the
      # secret, box .env only.
      GATEWAY_KILL_MICRO: ${GATEWAY_KILL_MICRO:-}
      GATEWAY_ALARM_DAY_MICRO: ${GATEWAY_ALARM_DAY_MICRO:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    command: ["node", "/gateway.js"]
    networks: [web]

  # The hardened friend shape as a real but inert service (scale 0 = `up`
  # creates no container). Friends live in compose.override.yaml and
  # `extends` this — the anchor above stays the single home. (A YAML
  # anchor cannot cross files, and extends inherits `profiles`, so scale
  # is the parking that works.) new-friend.sh writes the override; its
  # shape, for the record (the /ship bind is the friend's OWN staging
  # prefix of the store — each container can write its slice and nothing
  # else; runbook §the store — and the lane trio WC_GATEWAY_URL +
  # ANTHROPIC_API_KEY (the VIRTUAL key) + WC_MODEL puts the friend's pi on
  # the house lane, R12):
  #
  #   wc-alice:
  #     extends: {file: compose.yaml, service: wc-template}
  #     scale: 1
  #     environment:
  #       WC_PLAYER: alice
  #       WC_GATEWAY_URL: http://gateway:4100
  #       WC_MODEL: anthropic/claude-haiku-4-5
  #       ANTHROPIC_API_KEY: <virtual key from gateway-state/keys.json>
  #     volumes:
  #       - data-alice:/home/player/game/data
  #       - sessions-alice:/home/player/.pi/agent/sessions
  #       - /srv/gamemaster-bernd/store/staging/alice:/ship
  wc-template:
    <<: *friend
    scale: 0
    # Hub mode: every friend inherits `ingress` through extends — the hub
    # caddy dials each door's container directly (wc-<name>:7681). wc-test
    # stays off it (the anchor's [web] alone): the dev rig needs no hub.
    networks: [web, ingress]

  # -- local end-to-end check only (never on the VPS): -----------------------
  # The dev rig's own front door — the box door is the hub's caddy since
  # H1a (the apex and its landing pages moved home with it).
  caddy-local:
    profiles: [local]
    image: caddy:2.10.2
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks: [web, wake]

  # localcheck's pretend Anthropic: the gateway's upstream when the check
  # runs keyless (localcheck exports GATEWAY_UPSTREAM=http://stub:9990).
  stub:
    profiles: [local]
    image: node:24-trixie-slim
    init: true
    restart: "no"
    volumes:
      - ./gateway/stub-upstream.mjs:/stub.js:ro
    command: ["node", "/stub.js"]
    networks: [web]

  wc-test:
    profiles: [local]
    <<: *friend
    restart: "no"
    environment:
      WC_PLAYER: test
      # The lane trio, exactly as new-friend.sh writes it for a real friend —
      # the virtual key matches localcheck's throwaway keys.json.
      WC_GATEWAY_URL: http://gateway:4100
      WC_MODEL: anthropic/claude-haiku-4-5
      ANTHROPIC_API_KEY: wc-local-good
    volumes:
      - data-test:/home/player/game/data
      - sessions-test:/home/player/.pi/agent/sessions
      # localcheck.sh exports the real path; the default is never created
      # (config parses it, only `up wc-test` would mount it — local profile).
      - ${WC_TEST_SHIP:-/tmp/wc-test-ship}:/ship

networks:
  web:
  wake:
  # The hub's shared tenant network (contract §A.1): attachable, owned by
  # the WorldConsole repo's compose, its subnet pinned inside the box
  # firewall's egress drops. External — joining never creates it; on solo
  # dev machines localcheck makes (and removes) a throwaway.
  ingress:
    external: true
    name: world-console_ingress

volumes:
  data-test:
  sessions-test:
  # per-friend volumes (data-<name>, sessions-<name>) live with their
  # services in the box-local compose.override.yaml
