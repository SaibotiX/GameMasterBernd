# Stage-1 host stack (02 item 1 + the hardening bullets): Caddy in front,
# one hardened container per friend behind it. Friend services and their
# volumes are minted by new-friend.sh into the box-local, gitignored
# compose.override.yaml (compose auto-merges it; each friend `extends`
# wc-template below) — the tracked tree never carries a friend. Local
# end-to-end check: the `local` profile (localcheck.sh drives it) — same
# friend shape, self-signed TLS, throwaway volumes.
name: world-console

# The security boundary is the container (02): pi has no permission system,
# so the box a friend's model can reach IS the box we give it. Read-only
# root; ~/.pi/agent on tmpfs so auth.json lives and dies with the container
# (R11) while sessions/ and data/ persist as named volumes; no capabilities;
# bounded memory, cpu and pids. Outbound internet stays open (model APIs,
# MediaWiki hosts) — the LOCAL network is what must be unreachable, and that
# is firewall.sh's DOCKER-USER job on the host, not a compose concern.
x-friend: &friend
  image: world-console:latest
  init: true
  read_only: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,uid=1001,gid=1001
    - /home/player/.pi/agent:rw,uid=1001,gid=1001
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 256
  expose: ["7681"]
  networks: [web]

services:
  # BOX-ONLY: needs ./.env (ACME_EMAIL) — an empty email is a Caddyfile
  # parse error, and restart:unless-stopped turns it into a quiet crash
  # loop (a dev machine learned this on eyeball night). The dev-machine
  # door is localcheck.sh (profile: local); this service never runs off
  # the box.
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ACME account mailbox — set in .env on the box (gitignored), never here.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # Directory mount on purpose: a single-FILE bind mount pins the inode,
      # and any editor or sed that writes-and-renames leaves the container
      # reading the OLD file after every reload (the first onboarding found
      # it: valid config on the host, phantom 404 behind the door).
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]

  # The hardened friend shape as a real but inert service (scale 0 = `up`
  # creates no container). Friends live in compose.override.yaml and
  # `extends` this — the anchor above stays the single home. (A YAML
  # anchor cannot cross files, and extends inherits `profiles`, so scale
  # is the parking that works.) new-friend.sh writes the override; its
  # shape, for the record:
  #
  #   wc-alice:
  #     extends: {file: compose.yaml, service: wc-template}
  #     scale: 1
  #     volumes:
  #       - data-alice:/home/player/game/data
  #       - sessions-alice:/home/player/.pi/agent/sessions
  wc-template:
    <<: *friend
    scale: 0

  # -- local end-to-end check only (never on the VPS): -----------------------
  caddy-local:
    profiles: [local]
    image: caddy:2.10.2
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks: [web]

  wc-test:
    profiles: [local]
    <<: *friend
    restart: "no"
    volumes:
      - data-test:/home/player/game/data
      - sessions-test:/home/player/.pi/agent/sessions

networks:
  web:

volumes:
  caddy-data:
  caddy-config:
  data-test:
  sessions-test:
  # per-friend volumes (data-<name>, sessions-<name>) live with their
  # services in the box-local compose.override.yaml
